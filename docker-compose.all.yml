services:
  qiushi-gold:
    build:
      context: ..
      dockerfile: qiushiClawBot/Dockerfile.all
    container_name: qiushi-gold
    restart: unless-stopped
    env_file:
      - .env
      - ../gold/.env
    environment:
      HOST: 0.0.0.0
      WEB_HOST: 0.0.0.0
      CLAWBOT_STATE_DIR: /app/.clawbot/users
      WECHAT_FORWARDER_URL: http://127.0.0.1:${PORT:-8711}/send
    ports:
      - "${PORT:-8711}:${PORT:-8711}"
      - "${WEB_PORT:-8787}:${WEB_PORT:-8787}"
    volumes:
      - ./.clawbot:/app/.clawbot
